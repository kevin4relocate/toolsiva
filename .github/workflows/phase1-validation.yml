name: Toolsiva CI — Tools, Blog and Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolsiva-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:phase1
      - run: npm run test:validators
      - run: npm run test:phase2
      - run: npm run blog:validate
      - run: npm run check
      - run: npm run build
      - run: npm run tools:verify
