name: Toolsiva CI — Tools, Blog and Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolsiva-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:phase1
      - run: npm run test:validators
      - run: npm run test:phase2
      - run: npm run test:phase3
      - run: npm run test:phase4
      - run: npm run test:phase5
      - run: npm run test:phase6
      - run: npm run blog:validate
      - run: npm run check
      - run: npm run build
      - run: npm run tools:verify
      - run: npm run analytics:verify
      - run: npm run seo:audit
      - run: npm run hardening:verify
      - name: Upload SEO audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolsiva-seo-audit
          path: |
            reports/production-seo-audit.json
            reports/production-seo-issues.csv
          if-no-files-found: warn
