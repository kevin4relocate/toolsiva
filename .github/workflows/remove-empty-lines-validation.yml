name: Validate Remove Empty Lines

on:
  push:
    branches:
      - agent/remove-empty-lines-prefix-suffix

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
      - name: Astro check
        run: npm run check
      - name: Production build
        run: npm run build
