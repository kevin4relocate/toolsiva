name: Generate Toolsiva Guide Draft for Editorial Review
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: npm run blog:generate
      - run: npm run blog:validate
      - run: npm run test:phase1
      - run: npm run test:validators
      - run: npm run test:phase2
      - run: npm run test:phase3
      - run: npm run test:phase4
      - run: npm run test:phase5
      - run: npm run test:phase6
      - run: npm run check
      - run: npm run build
      - run: npm run tools:verify
      - run: npm run analytics:verify
      - run: npm run seo:audit
      - run: npm run hardening:verify
      - name: Open editorial review PR (never auto-publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="content/review-guide-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git config user.name "Toolsiva Blog Bot"
          git config user.email "blog-bot@toolsiva.com"
          git add src/content/blog
          git diff --cached --quiet && exit 0
          git commit -m "draft(blog): add guide pending editorial review"
          git push origin HEAD:"$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Review Toolsiva guide draft #${{ github.run_id }}" \
            --body "AI-assisted draft: verify every factual claim, tool output, example, citations where relevant, originality and policy compliance. Keep draft: true until editorial review is complete. No ad serving on unpublished or low-value pages."
